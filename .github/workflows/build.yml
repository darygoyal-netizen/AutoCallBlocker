name: Build Signed Release Call Blocker

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Release Keystore & Build Signed Release APK
        run: |
          keytool -genkey -v -keystore release.keystore -alias blockerkey -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Harshit, OU=Mobile, O=Blocker, L=Shamli, S=UP, C=IN"
          gradle assembleRelease

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoCallBlocker-Signed-Release
          path: app/build/outputs/apk/release/app-release.apk
          
